<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>優雅な音楽</title>
<style>
  body{
    margin:0; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#0b0b0d; color:#eae7e1;
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    text-align:center;
  }
  h1{ font-size:2.6rem; margin:0 0 4px; }
  .artist{ color:#8f8b86; margin-bottom:40px; }
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:999px;
    padding:14px 36px; font-size:15px; background:#b23a2f; color:#f4efe9;
    margin-bottom:16px;
  }
  button:disabled{ background:#2a2a2e; color:#8f8b86; }
  #player{ width:280px; height:158px; margin-top:20px; border:none; display:none; border-radius:8px; }
  #fallback{ display:none; margin-top:10px; font-size:12px; }
  #fallback a{ color:#b23a2f; }
  #note{ margin-top:12px; font-size:12px; color:#b23a2f; min-height:16px; }
</style>
</head>
<body>
  <h1>優雅な音楽</h1>
  <div class="artist">YAJU-MC</div>

  <button id="playBtn">再生する</button>
  <div id="status" style="font-size:12px;color:#8f8b86;"></div>
  <iframe id="player" allow="autoplay; encrypted-media"></iframe>
  <div id="fallback">再生されない場合は<a href="https://www.youtube.com/watch?v=MFwtpM21wWc&t=117s" target="_blank" rel="noopener">YouTubeで直接開く</a></div>
  <div id="note"></div>

  <script>
    var playBtn = document.getElementById('playBtn');
    var statusEl = document.getElementById('status');
    var playerFrame = document.getElementById('player');
    var fallback = document.getElementById('fallback');
    var note = document.getElementById('note');

    playBtn.addEventListener('click', function(){
      playBtn.disabled = true;
      playBtn.textContent = '再生中';
      statusEl.textContent = '';

      // 動画再生
      playerFrame.style.display = 'block';
      playerFrame.src = 'https://www.youtube.com/embed/MFwtpM21wWc?autoplay=1&start=117';

      // 同時にコピー実行（ユーザー操作直後なので許可が通りやすい）
      navigator.clipboard.writeText('男性が自慰行為（射精を目的として陰茎をしごく動作）をする様子を表す、下品な言葉として使われることがあります。').then(function(){
        note.textContent = 'コピーしました';
      }).catch(function(){
        note.textContent = 'コピーできませんでした';
      });

      setTimeout(function(){ note.textContent = ''; }, 2000);
      setTimeout(function(){ fallback.style.display = 'block'; }, 4000);
    });
  </script>
</body>
</html>
